services:
  - type: cron
    name: uutisgrinderbot
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    # UTC 06 and 07: code selects only 09:00 Europe/Helsinki, including DST.
    schedule: "0 6,7 * * *"
    buildCommand: python -m unittest discover -s tests -v
    startCommand: python bot.py scheduled
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
